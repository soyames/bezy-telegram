    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.6}.wrap{width:min(100% - 28px,760px);margin:0 auto;padding:28px 0 60px}.brand{display:flex;align-items:center;gap:10px;margin-bottom:24px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#8b5cf6,#ec4899);display:grid;place-items:center;color:#fff;font-weight:900;font-size:22px}.brand b{font-size:24px}.brand span{display:block;color:var(--muted);font-size:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 12px 35px rgba(31,23,43,.07)}h1{font-size:30px;letter-spacing:-.8px;margin:0 0 6px}h2{font-size:19px;margin:28px 0 8px}p,li{font-size:14px}small,.updated{color:var(--muted)}a{color:var(--accent)}.notice{background:#f1ebff;border-radius:16px;padding:14px;font-size:13px;margin:18px 0}.lang{display:flex;gap:8px;margin:0 0 18px}.lang a{padding:7px 11px;border-radius:999px;background:#f1ebff;text-decoration:none;font-size:12px;font-weight:700}.footer{margin-top:18px;text-align:center;color:var(--muted);font-size:12px}

const isFr=new URLSearchParams(location.search).get('lang')==='fr'||(navigator.language||'').toLowerCase().startsWith('fr');
const en={title:'Privacy Policy',date:'Effective date: 9 September 2026',intro:'Bezy is a Telegram-native service. The Bezy Mini App runs inside Telegram, while Bezy services are operated through Vercel and a server-side Cloud Firestore database.',sections:[
['1. Who is responsible for your data?','Bezy is operated by <strong>DIGITAL CONCORDIA</strong>, a business registered in Benin under Registration No. <strong>RB/ABC/21 A 28773</strong>, registered on 25 March 2021 with the Cotonou Commercial Court, and represented by its owner and legal representative, Yao Sossou. Registered address: <strong>Abomey-Calavi, Benin</strong>. Digital Concordia is the operating and trade name used for Bezy; the underlying business registration number is RB/ABC/21 A 28773. You can contact us at <strong>contacts@digitalconcordia.com</strong>.'],
['2. What information we collect','When you use Bezy through Telegram, we may process your Telegram user ID, first name, last name, username, language preference and profile photo URL when Telegram makes it available. We also process information you choose to provide in your Bezy profile, such as age, gender, location or approximate distance, interests, relationship preferences and profile text. We may process likes, passes, matches, membership status, reports and moderation information needed to operate and protect the service.'],
['3. Messages','Bezy is designed so that conversations take place through Telegram. Bezy does not need to create a separate external messaging account. We will only store message content when a specific feature requires it and the purpose is clearly explained.'],
['4. Why we use your information','We use information to authenticate you through Telegram, create and maintain your Bezy profile, provide discovery and matching, operate matches and notifications, provide paid features, prevent abuse and fraud, enforce our rules, improve reliability, and comply with legal obligations.'],
['5. Legal bases','For users in the European Economic Area, processing may rely on performance of the service contract, your consent where consent is required, our legitimate interests in security and service operation, and legal obligations. Where we rely on consent, you may withdraw it as described in the service or by contacting us.'],
['6. Service providers','Bezy currently uses Telegram for identity, messaging and the Mini App environment; Vercel for hosting and serverless API execution; and Google Firebase Cloud Firestore as the server-side database. The Bezy backend uses the Firebase Admin SDK from Vercel. Firebase client access is intentionally disabled. We do not currently use Firebase Cloud Functions or Firebase Cloud Storage.'],
['7. Payments','If Bezy offers paid membership or digital goods through Telegram Stars, payment processing is handled through Telegram’s payment infrastructure. Bezy does not need your card number or bank credentials to provide the Telegram Stars purchase flow. Additional payment information is governed by the applicable Telegram terms and payment-provider rules.'],
['8. Data retention','We retain personal data only for as long as reasonably necessary for the purposes described above, including account operation, safety, dispute handling and legal obligations. Retention periods may differ by data type. We will define specific deletion schedules before public launch.'],
['9. Your rights','Depending on applicable law, you may have rights to access, correct, delete, restrict or object to processing, and to receive a portable copy of certain data. Four of these are built into Bezy and you can use them yourself at any time: open Bezy, go to Profile, then Safety &amp; privacy. <strong>Download my data</strong> gives you a machine-readable copy of your Bezy account, profile, decisions, blocks, matches and payment records. <strong>Pause processing</strong> restricts processing: we keep your data but stop using it, your profile leaves Discover, you cannot like or match, and we stop sending you match and Super Like messages. Nothing is deleted and you can lift it yourself at any time. <strong>Object to processing</strong> lets you exercise your right to object: we stop using your data for discovery and matching, nothing is deleted, and you can withdraw the objection yourself at any time. <strong>Delete my account</strong> permanently removes your profile, your likes and passes, your matches and your blocks. For any other request, or to complain to your local data protection authority, contact <strong>contacts@digitalconcordia.com</strong>. We aim to answer within 3 working days. We may need to verify that a request relates to the correct Telegram account.'],
['10. Children','Bezy is intended for adults aged 18 and over. Before using Bezy, each person must explicitly declare that they are 18 or older; we store that declaration, the time it was made, and the fact that it is a self-declaration. Bezy does not verify identity or age, and does not claim its users are verified adults. We do not knowingly allow minors to create or use dating profiles. If you believe a minor is using Bezy, contact us at <strong>contacts@digitalconcordia.com</strong>.'],
['11. Security','We use reasonable technical and organisational measures to protect Bezy data. Telegram Mini App identity data is validated server-side before it is trusted. Firestore direct client access is denied; server-side access is performed through authenticated administrative credentials stored as Vercel environment variables.'],
['12. Changes','We may update this policy when Bezy changes or when legal requirements change. The effective date at the top will identify the current version. Material changes will be communicated through Bezy or the Telegram bot where appropriate.'],
['13. Safety, blocking and reporting','If you block someone in Bezy, we record that block so neither of you appears to the other in discovery and neither can like or match the other. If you report someone, we store who reported whom, the reason you selected, any description you write, and a status, so that a person can review it. We do not copy the reported profile into the report. Reports about a user are kept even if that user deletes their Bezy account, so a record of conduct cannot be erased by the person responsible for it. Blocking or reporting someone in Bezy does not block or report them on Telegram; use Telegram’s own controls for that.'],
['14. Deleting your account','You can delete your Bezy account at any time from Profile then Safety &amp; privacy. This removes your profile, your discovery preferences, your likes, passes and super likes, the record of who liked you, your blocks, and it ends your matches. Two things are deliberately kept: records of payments you made, retained to meet accounting obligations, containing only a Telegram identifier, a plan, an amount and dates; and reports other people filed about you. Deleting your Bezy account does not delete your Telegram account, and does not delete conversations already held in Telegram, which are outside our control.'],
['15. How matching works','Bezy orders the profiles you see using a simple, fixed calculation: interests you share, whether you are in the same city, and how close you are in age. Premium members receive a small fixed boost in that ordering. This only changes the order in which people are shown to you. It does not decide anything about you, it does not exclude anyone you could otherwise reach, and every like or pass is your own decision. There is no artificial intelligence and no hidden profiling.']
]};
const fr={title:'Politique de confidentialité',date:'Date d’entrée en vigueur : 9 septembre 2026',intro:'Bezy est un service conçu pour Telegram. La Mini App Bezy fonctionne dans Telegram, tandis que les services Bezy sont hébergés via Vercel et utilisent Cloud Firestore comme base de données côté serveur.',sections:[
['1. Responsable du traitement','Bezy est exploité par <strong>DIGITAL CONCORDIA</strong>, entreprise enregistrée au Bénin sous le n° d’immatriculation <strong>RB/ABC/21 A 28773</strong>, immatriculée le 25 mars 2021 auprès du Tribunal de Commerce de Cotonou, et représentée par son propriétaire et représentant légal, Yao Sossou. Adresse enregistrée : <strong>Abomey-Calavi, Bénin</strong>. Digital Concordia est le nom commercial et d’exploitation utilisé pour Bezy ; le numéro d’immatriculation de l’entreprise sous-jacente est RB/ABC/21 A 28773. Contact : <strong>contacts@digitalconcordia.com</strong>.'],
['2. Données que nous collectons','Lorsque vous utilisez Bezy via Telegram, nous pouvons traiter votre identifiant Telegram, prénom, nom, nom d’utilisateur, préférence linguistique et URL de photo de profil lorsque Telegram la rend disponible. Nous traitons également les informations que vous choisissez de fournir dans votre profil Bezy, comme l’âge, le genre, la localisation ou distance approximative, les centres d’intérêt, les préférences relationnelles et la présentation. Nous pouvons traiter les likes, passages, matchs, statut d’abonnement, signalements et informations de modération nécessaires au fonctionnement et à la sécurité du service.'],
['3. Messages','Bezy est conçu pour que les conversations aient lieu via Telegram. Bezy n’a pas besoin de créer un compte de messagerie externe séparé. Nous ne conserverons le contenu des messages que lorsqu’une fonctionnalité précise l’exige et que cette finalité est clairement indiquée.'],
['4. Pourquoi nous utilisons vos données','Nous utilisons les données pour vous authentifier via Telegram, créer et gérer votre profil Bezy, proposer la découverte et le matching, gérer les matchs et notifications, fournir les fonctionnalités payantes, lutter contre les abus et la fraude, appliquer nos règles, améliorer la fiabilité et respecter nos obligations légales.'],
['5. Bases juridiques','Pour les utilisateurs de l’Espace économique européen, le traitement peut être fondé sur l’exécution du service, votre consentement lorsque celui-ci est requis, nos intérêts légitimes liés à la sécurité et au fonctionnement du service, ainsi que nos obligations légales. Lorsque nous nous fondons sur votre consentement, vous pouvez le retirer.'],
['6. Prestataires','Bezy utilise actuellement Telegram pour l’identité, la messagerie et l’environnement Mini App ; Vercel pour l’hébergement et l’exécution des API serverless ; et Google Firebase Cloud Firestore comme base de données côté serveur. Le backend Bezy utilise le Firebase Admin SDK depuis Vercel. L’accès direct de la Mini App à Firebase est volontairement désactivé. Nous n’utilisons actuellement ni Firebase Cloud Functions ni Firebase Cloud Storage.'],
['7. Paiements','Si Bezy propose des abonnements ou biens numériques via Telegram Stars, le paiement est traité par l’infrastructure de paiement de Telegram. Bezy n’a pas besoin de votre numéro de carte ou de vos identifiants bancaires pour le paiement via Telegram Stars. Les informations de paiement supplémentaires sont régies par les conditions applicables de Telegram et des prestataires de paiement.'],
['8. Conservation','Nous conservons les données personnelles uniquement pendant la durée raisonnablement nécessaire aux finalités décrites, notamment pour le fonctionnement du compte, la sécurité, la gestion des litiges et les obligations légales. Les durées peuvent varier selon le type de données. Des calendriers précis de suppression seront définis avant le lancement public.'],
['9. Vos droits','Selon la législation applicable, vous pouvez disposer de droits d’accès, de rectification, d’effacement, de limitation ou d’opposition, ainsi que du droit à la portabilité de certaines données. Quatre de ces droits sont intégrés à Bezy et vous pouvez les exercer vous-même à tout moment : ouvrez Bezy, allez dans Profil, puis Sécurité et confidentialité. <strong>Télécharger mes données</strong> vous fournit une copie lisible par machine de votre compte, profil, décisions, blocages, matchs et paiements. <strong>Suspendre le traitement</strong> limite le traitement : nous conservons vos données mais cessons de les utiliser, votre profil quitte Découvrir, vous ne pouvez plus liker ni matcher, et nous cessons de vous envoyer des messages de match et de Super Like. Rien n’est supprimé et vous pouvez lever cette suspension vous-même à tout moment. <strong>S’opposer au traitement</strong> vous permet d’exercer votre droit d’opposition : nous cessons d’utiliser vos données pour la découverte et les matchs, rien n’est supprimé, et vous pouvez retirer votre opposition vous-même à tout moment. <strong>Supprimer mon compte</strong> supprime définitivement votre profil, vos likes et passes, vos matchs et vos blocages. Pour toute autre demande, ou pour saisir votre autorité de protection des données, contactez <strong>contacts@digitalconcordia.com</strong>. Nous nous efforçons de répondre sous 3 jours ouvrés. Nous pourrons devoir vérifier que la demande concerne le bon compte Telegram.'],
['10. Mineurs','Bezy est réservé aux adultes âgés de 18 ans ou plus. Avant d’utiliser Bezy, chaque personne doit déclarer explicitement avoir 18 ans ou plus ; nous conservons cette déclaration, sa date et le fait qu’il s’agit d’une déclaration sur l’honneur. Bezy ne vérifie ni l’identité ni l’âge et n’affirme pas que ses utilisateurs sont des adultes vérifiés. Nous n’autorisons pas sciemment les mineurs à créer ou utiliser un profil de rencontre. Si vous pensez qu’un mineur utilise Bezy, contactez-nous à <strong>contacts@digitalconcordia.com</strong>.'],
['11. Sécurité','Nous appliquons des mesures techniques et organisationnelles raisonnables pour protéger les données Bezy. Les données d’identité de la Mini App Telegram sont validées côté serveur avant d’être considérées comme fiables. L’accès direct de la Mini App à Firestore est refusé ; l’accès serveur utilise des identifiants administratifs protégés dans les variables d’environnement Vercel.'],
['12. Modifications','Nous pouvons mettre à jour cette politique lorsque Bezy évolue ou lorsque les exigences légales changent. La date d’entrée en vigueur indique la version actuelle. Les changements importants pourront être communiqués via Bezy ou le bot Telegram lorsque cela est approprié.'],
['13. Sécurité, blocage et signalement','Si vous bloquez une personne dans Bezy, nous enregistrons ce blocage afin qu’aucun de vous n’apparaisse à l’autre dans la découverte et qu’aucun ne puisse liker l’autre ni matcher avec lui. Si vous signalez une personne, nous conservons qui a signalé qui, le motif choisi, la description éventuelle et un statut, afin qu’une personne puisse l’examiner. Nous ne copions pas le profil signalé dans le signalement. Les signalements concernant un utilisateur sont conservés même si celui-ci supprime son compte Bezy, afin qu’un historique de comportement ne puisse pas être effacé par la personne concernée. Bloquer ou signaler une personne dans Bezy ne la bloque ni ne la signale sur Telegram ; utilisez pour cela les contrôles propres à Telegram.'],
['14. Suppression de votre compte','Vous pouvez supprimer votre compte Bezy à tout moment depuis Profil puis Sécurité et confidentialité. Cela supprime votre profil, vos préférences de découverte, vos likes, passes et super likes, la liste des personnes vous ayant liké, vos blocages, et met fin à vos matchs. Deux éléments sont volontairement conservés : les enregistrements de vos paiements, conservés pour satisfaire des obligations comptables et ne contenant qu’un identifiant Telegram, une formule, un montant et des dates ; et les signalements déposés à votre sujet par d’autres personnes. La suppression de votre compte Bezy ne supprime pas votre compte Telegram, ni les conversations déjà tenues dans Telegram, qui échappent à notre contrôle.'],
['15. Fonctionnement du matching','Bezy classe les profils qui vous sont présentés selon un calcul simple et fixe : les centres d’intérêt communs, le fait d’être dans la même ville et la proximité d’âge. Les membres Premium bénéficient d’un léger bonus fixe dans ce classement. Cela ne modifie que l’ordre d’affichage. Aucune décision n’est prise à votre sujet, personne n’est exclu de votre portée, et chaque like ou passe reste votre propre décision. Il n’y a ni intelligence artificielle ni profilage caché.']
]};
const d=isFr?fr:en;document.documentElement.lang=isFr?'fr':'en';document.title=isFr?'Bezy — Confidentialité':'Bezy — Privacy';document.getElementById('tagline').textContent=isFr?'Rencontrez quelqu’un qui mérite d’être connu.':'Meet someone worth knowing.';const other=document.getElementById('other-link');other.textContent=isFr?'Conditions':'Terms';other.href='/terms?lang='+(isFr?'fr':'en');document.getElementById('content').innerHTML=`<h1>${d.title}</h1><div class="updated">${d.date}</div><div class="notice">${d.intro}</div>${d.sections.map(s=>`<section><h2>${s[0]}</h2><p>${s[1]}</p></section>`).join('')}`;
</script>
