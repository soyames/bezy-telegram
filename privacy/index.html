<script>
const isFr=new URLSearchParams(location.search).get('lang')==='fr'||(navigator.language||'').toLowerCase().startsWith('fr');
const en={title:'Privacy Policy',date:'Effective date: 10 September 2026',intro:'Bezy is a Telegram-native service. The Bezy Mini App runs inside Telegram, while Bezy services are operated through Vercel and a server-side Cloud Firestore database.',sections:[
['1. Who is responsible for your data?','Bezy is operated by <strong>DIGITAL CONCORDIA</strong>, a business registered in Benin under Registration No. <strong>RB/ABC/21 A 28773</strong>, registered on 25 March 2021 with the Cotonou Commercial Court, and represented by its owner and legal representative, Yao Sossou. Registered address: <strong>Abomey-Calavi, Benin</strong>. Digital Concordia is the operating and trade name used for Bezy; the underlying business registration number is RB/ABC/21 A 28773. You can contact us at <strong>contacts@digitalconcordia.com</strong>.'],
['2. What information we collect','When you use Bezy through Telegram, we may process your Telegram user ID, first name, username, language preference and profile photo URL when Telegram makes it available. We do not collect your Telegram last name. We also process information you choose to provide in your Bezy profile: age, gender, who you are looking for, the city you enter (we do not use GPS or precise location), interests, a short bio, optional profile prompts, optional spoken languages and profile text. We also process likes, passes, matches, membership status, reports and moderation information, the operational counters needed for daily limits and abuse protection, notification preferences, and any support requests you send us.'],
['3. Messages','Bezy is designed so that conversations take place through Telegram. Bezy does not store your Telegram conversations and has no messaging database. The one exception: when you ask Bezy support for help, the description you send is stored with your support request (capped at 1000 characters) and is deleted with your account.'],
['4. Why we use your information','We use information to authenticate you through Telegram, create and maintain your Bezy profile, provide discovery and matching, operate matches and notifications (including optional profile-reminders — at most one per week, which you can switch off), provide paid features, prevent abuse and fraud, enforce our rules, answer support requests, improve reliability, and comply with legal obligations.'],
['5. Legal bases','For users in the European Economic Area, processing may rely on performance of the service contract, your consent where consent is required, our legitimate interests in security and service operation, and legal obligations. Where we rely on consent, you may withdraw it as described in the service or by contacting us.'],
['6. Service providers','Bezy currently uses Telegram for identity, messaging and the Mini App environment; Vercel for hosting and serverless API execution; and Google Firebase Cloud Firestore as the server-side database. The Bezy backend uses the Firebase Admin SDK from Vercel. Firebase client access is intentionally disabled. We do not currently use Firebase Cloud Functions or Firebase Cloud Storage.'],
['7. Payments','If Bezy offers paid membership or digital goods through Telegram Stars, payment processing is handled through Telegram’s payment infrastructure. Bezy does not need your card number or bank credentials to provide the Telegram Stars purchase flow. Additional payment information is governed by the applicable Telegram terms and payment-provider rules.'],
['8. Data retention','We retain personal data only for as long as reasonably necessary for the purposes described above, including account operation, safety, dispute handling and legal obligations. Bezy already applies defined deletion schedules for operational data: incomplete accounts with no activity are removed after about 90 days, ended matches after about 180 days, spent invoice links after 30 days, rate-limit counters after 7 days, and support requests after 365 days unless you delete your account first. Payment records and safety reports are kept until their retention periods are confirmed by legal and accounting review — the deletion mechanism exists, but those periods are deliberately not set yet. These schedules are applied by an operator-run tool; Bezy does not run an automatic scheduler.'],
['9. Your rights','Depending on applicable law, you may have rights to access, correct, delete, restrict or object to processing, and to receive a portable copy of certain data. Four of these are built into Bezy and you can use them yourself at any time: open Bezy, go to Profile, then Privacy &amp; your data. <strong>Download my data</strong> gives you a machine-readable copy of your Bezy account, profile, preferences, notification settings, decisions, blocks, matches, support requests and payment records. <strong>Pause processing</strong> restricts processing: we keep your data but stop using it, your profile leaves Discover, you cannot like or match, and we stop sending you match and Super Like messages. Nothing is deleted and you can lift it yourself at any time. <strong>Object to processing</strong> lets you exercise your right to object: we stop using your data for discovery and matching, nothing is deleted, and you can withdraw the objection yourself at any time. <strong>Delete my account</strong> permanently removes your profile, your likes and passes, your blocks and your support requests, and ends your matches. For any other request, or to complain to your local data protection authority, contact <strong>contacts@digitalconcordia.com</strong>. We aim to answer within 3 working days. We may need to verify that a request relates to the correct Telegram account.'],
['10. Children','Bezy is intended for adults aged 18 and over. Before using Bezy, each person must explicitly declare that they are 18 or older; we store that declaration, the time it was made, and the fact that it is a self-declaration. Bezy does not verify identity or age, and does not claim its users are verified adults. We do not knowingly allow minors to create or use dating profiles. If you believe a minor is using Bezy, contact us at <strong>contacts@digitalconcordia.com</strong>.'],
['11. Security','We use reasonable technical and organisational measures to protect Bezy data. Telegram Mini App identity data is validated server-side before it is trusted. Firestore direct client access is denied; server-side access is performed through authenticated administrative credentials stored as Vercel environment variables.'],
['12. Changes','We may update this policy when Bezy changes or when legal requirements change. The effective date at the top will identify the current version. Material changes will be communicated through Bezy or the Telegram bot where appropriate.'],
['13. Safety, blocking and reporting','If you block someone in Bezy, we record that block so neither of you appears to the other in discovery and neither can like or match the other. If you report someone, we store who reported whom, the reason you selected, any description you write, a status and any moderation note, so that a person can review it. We do not copy the reported profile into the report. Reports are kept even if either account is deleted, so a record of conduct cannot be erased by the person responsible for it. Blocking or reporting someone in Bezy does not block or report them on Telegram; use Telegram’s own controls for that.'],
['14. Deleting your account','You can delete your Bezy account at any time from Profile then Privacy &amp; your data. This removes your profile, your discovery preferences, your likes, passes and super likes, the record of who liked you, your blocks and your support requests, and it ends your matches. Four things are deliberately kept: records of payments you made, retained to meet accounting obligations, containing only a Telegram identifier, a plan, an amount and dates; the invoice links belonging to those payments; and reports — both those you filed and those filed about you, so a record of conduct cannot be erased by the person responsible for it. Deleting your Bezy account does not delete your Telegram account, and does not delete conversations already held in Telegram, which are outside our control.'],
['15. How matching works','Bezy first filters who you can see: your profile must be complete and visible, both people must meet each other’s age range and “looking for” settings, and neither may have blocked, paused or already decided on the other. Among eligible profiles, Bezy orders what you see with a simple, fixed calculation: a base value, plus points for interests you share, a shared spoken language, being in the same city, closeness in age, and a small bonus for a completed bio. Premium members receive a small fixed boost in that ordering. The score only changes order — it is computed only from what both people wrote in their own profiles, it never decides anything about you, and every like or pass is your own decision. Premium members can also see why a score is what it is, using the same on-profile facts. There is no artificial intelligence and no hidden profiling.']
]};
const fr={title:'Politique de confidentialité',date:'Date d’entrée en vigueur : 10 septembre 2026',intro:'Bezy est un service conçu pour Telegram. La Mini App Bezy fonctionne dans Telegram, tandis que les services Bezy sont hébergés via Vercel et utilisent Cloud Firestore comme base de données côté serveur.',sections:[
['1. Responsable du traitement','Bezy est exploité par <strong>DIGITAL CONCORDIA</strong>, entreprise enregistrée au Bénin sous le n° d’immatriculation <strong>RB/ABC/21 A 28773</strong>, immatriculée le 25 mars 2021 auprès du Tribunal de Commerce de Cotonou, et représentée par son propriétaire et représentant légal, Yao Sossou. Adresse enregistrée : <strong>Abomey-Calavi, Bénin</strong>. Digital Concordia est le nom commercial et d’exploitation utilisé pour Bezy ; le numéro d’immatriculation de l’entreprise sous-jacente est RB/ABC/21 A 28773. Contact : <strong>contacts@digitalconcordia.com</strong>.'],
['2. Données que nous collectons','Lorsque vous utilisez Bezy via Telegram, nous pouvons traiter votre identifiant Telegram, prénom, nom d’utilisateur, préférence linguistique et URL de photo de profil lorsque Telegram la rend disponible. Nous ne collectons pas votre nom de famille Telegram. Nous traitons également les informations que vous choisissez de fournir dans votre profil Bezy : l’âge, le genre, qui vous recherchez, la ville que vous saisissez (nous n’utilisons ni GPS ni localisation précise), les centres d’intérêt, une courte présentation, des accroches de profil facultatives, des langues parlées facultatives et le texte de profil. Nous traitons aussi les likes, passages, matchs, statut d’abonnement, signalements et informations de modération, les compteurs nécessaires aux limites quotidiennes et à la protection contre les abus, les préférences de notification et toute demande d’assistance que vous nous envoyez.'],
['3. Messages','Bezy est conçu pour que les conversations aient lieu via Telegram. Bezy ne conserve pas vos conversations Telegram et ne possède aucune base de données de messagerie. Une seule exception : lorsque vous demandez de l’aide au support Bezy, la description que vous envoyez est conservée avec votre demande d’assistance (limitée à 1000 caractères) et supprimée avec votre compte.'],
['4. Pourquoi nous utilisons vos données','Nous utilisons les données pour vous authentifier via Telegram, créer et gérer votre profil Bezy, proposer la découverte et le matching, gérer les matchs et notifications (y compris les rappels de profil facultatifs — un par semaine au maximum, désactivables), fournir les fonctionnalités payantes, lutter contre les abus et la fraude, appliquer nos règles, répondre aux demandes d’assistance, améliorer la fiabilité et respecter nos obligations légales.'],
['5. Bases juridiques','Pour les utilisateurs de l’Espace économique européen, le traitement peut être fondé sur l’exécution du service, votre consentement lorsque celui-ci est requis, nos intérêts légitimes liés à la sécurité et au fonctionnement du service, ainsi que nos obligations légales. Lorsque nous nous fondons sur votre consentement, vous pouvez le retirer.'],
['6. Prestataires','Bezy utilise actuellement Telegram pour l’identité, la messagerie et l’environnement Mini App ; Vercel pour l’hébergement et l’exécution des API serverless ; et Google Firebase Cloud Firestore comme base de données côté serveur. Le backend Bezy utilise le Firebase Admin SDK depuis Vercel. L’accès direct de la Mini App à Firebase est volontairement désactivé. Nous n’utilisons actuellement ni Firebase Cloud Functions ni Firebase Cloud Storage.'],
['7. Paiements','Si Bezy propose des abonnements ou biens numériques via Telegram Stars, le paiement est traité par l’infrastructure de paiement de Telegram. Bezy n’a pas besoin de votre numéro de carte ou de vos identifiants bancaires pour le paiement via Telegram Stars. Les informations de paiement supplémentaires sont régies par les conditions applicables de Telegram et des prestataires de paiement.'],
['8. Conservation','Nous conservons les données personnelles uniquement pendant la durée raisonnablement nécessaire aux finalités décrites, notamment pour le fonctionnement du compte, la sécurité, la gestion des litiges et les obligations légales. Bezy applique déjà des calendriers de suppression définis pour les données opérationnelles : les comptes incomplets sans activité sont supprimés après environ 90 jours, les matchs terminés après environ 180 jours, les liens de facture utilisés après 30 jours, les compteurs de limitation après 7 jours et les demandes d’assistance après 365 jours, sauf suppression préalable du compte. Les enregistrements de paiement et les signalements sont conservés jusqu’à ce que leurs durées soient confirmées par un examen juridique et comptable — le mécanisme de suppression existe, mais ces durées ne sont volontairement pas encore fixées. Ces calendriers sont appliqués par un outil exécuté par l’opérateur ; Bezy n’utilise aucun planificateur automatique.'],
['9. Vos droits','Selon la législation applicable, vous pouvez disposer de droits d’accès, de rectification, d’effacement, de limitation ou d’opposition, ainsi que du droit à la portabilité de certaines données. Quatre de ces droits sont intégrés à Bezy et vous pouvez les exercer vous-même à tout moment : ouvrez Bezy, allez dans Profil, puis Confidentialité et vos données. <strong>Télécharger mes données</strong> vous fournit une copie lisible par machine de votre compte, profil, préférences, paramètres de notification, décisions, blocages, matchs, demandes d’assistance et paiements. <strong>Suspendre le traitement</strong> limite le traitement : nous conservons vos données mais cessons de les utiliser, votre profil quitte Découvrir, vous ne pouvez plus liker ni matcher, et nous cessons de vous envoyer des messages de match et de Super Like. Rien n’est supprimé et vous pouvez lever cette suspension vous-même à tout moment. <strong>S’opposer au traitement</strong> vous permet d’exercer votre droit d’opposition : nous cessons d’utiliser vos données pour la découverte et les matchs, rien n’est supprimé, et vous pouvez retirer votre opposition vous-même à tout moment. <strong>Supprimer mon compte</strong> supprime définitivement votre profil, vos likes et passes, vos blocages et vos demandes d’assistance, et met fin à vos matchs. Pour toute autre demande, ou pour saisir votre autorité de protection des données, contactez <strong>contacts@digitalconcordia.com</strong>. Nous nous efforçons de répondre sous 3 jours ouvrés. Nous pourrons devoir vérifier que la demande concerne le bon compte Telegram.'],
['10. Mineurs','Bezy est réservé aux adultes âgés de 18 ans ou plus. Avant d’utiliser Bezy, chaque personne doit déclarer explicitement avoir 18 ans ou plus ; nous conservons cette déclaration, sa date et le fait qu’il s’agit d’une déclaration sur l’honneur. Bezy ne vérifie ni l’identité ni l’âge et n’affirme pas que ses utilisateurs sont des adultes vérifiés. Nous n’autorisons pas sciemment les mineurs à créer ou utiliser un profil de rencontre. Si vous pensez qu’un mineur utilise Bezy, contactez-nous à <strong>contacts@digitalconcordia.com</strong>.'],
['11. Sécurité','Nous appliquons des mesures techniques et organisationnelles raisonnables pour protéger les données Bezy. Les données d’identité de la Mini App Telegram sont validées côté serveur avant d’être considérées comme fiables. L’accès direct de la Mini App à Firestore est refusé ; l’accès serveur utilise des identifiants administratifs protégés dans les variables d’environnement Vercel.'],
['12. Modifications','Nous pouvons mettre à jour cette politique lorsque Bezy évolue ou lorsque les exigences légales changent. La date d’entrée en vigueur indique la version actuelle. Les changements importants pourront être communiqués via Bezy ou le bot Telegram lorsque cela est approprié.'],
['13. Sécurité, blocage et signalement','Si vous bloquez une personne dans Bezy, nous enregistrons ce blocage afin qu’aucun de vous n’apparaisse à l’autre dans la découverte et qu’aucun ne puisse liker l’autre ni matcher avec lui. Si vous signalez une personne, nous conservons qui a signalé qui, le motif choisi, la description éventuelle, un statut et toute note de modération, afin qu’une personne puisse l’examiner. Nous ne copions pas le profil signalé dans le signalement. Les signalements sont conservés même si l’un des comptes est supprimé, afin qu’un historique de comportement ne puisse pas être effacé par la personne concernée. Bloquer ou signaler une personne dans Bezy ne la bloque ni ne la signale sur Telegram ; utilisez pour cela les contrôles propres à Telegram.'],
['14. Suppression de votre compte','Vous pouvez supprimer votre compte Bezy à tout moment depuis Profil puis Confidentialité et vos données. Cela supprime votre profil, vos préférences de découverte, vos likes, passes et super likes, la liste des personnes vous ayant liké, vos blocages et vos demandes d’assistance, et met fin à vos matchs. Quatre éléments sont volontairement conservés : les enregistrements de vos paiements, conservés pour satisfaire des obligations comptables et ne contenant qu’un identifiant Telegram, une formule, un montant et des dates ; les liens de facture liés à ces paiements ; et les signalements — ceux que vous avez déposés comme ceux déposés à votre sujet, afin qu’un historique de comportement ne puisse pas être effacé par la personne concernée. La suppression de votre compte Bezy ne supprime pas votre compte Telegram, ni les conversations déjà tenues dans Telegram, qui échappent à notre contrôle.'],
['15. Fonctionnement du matching','Bezy filtre d’abord qui vous pouvez voir : votre profil doit être complet et visible, les deux personnes doivent correspondre à la tranche d’âge et aux préférences « je recherche » de l’autre, et aucune ne doit avoir bloqué, suspendu ou déjà jugé l’autre. Parmi les profils éligibles, Bezy ordonne ce que vous voyez avec un calcul simple et fixe : une valeur de base, plus des points pour les centres d’intérêt communs, une langue parlée en commun, le fait d’être dans la même ville, la proximité d’âge, et un petit bonus pour une présentation complétée. Les membres Premium bénéficient d’un léger bonus fixe dans ce classement. Le score ne modifie que l’ordre — il est calculé uniquement à partir de ce que chacun a écrit dans son propre profil, il ne décide jamais rien à votre sujet, et chaque like ou passe reste votre propre décision. Les membres Premium peuvent aussi voir pourquoi un score est ce qu’il est, à partir des mêmes informations de profil. Il n’y a ni intelligence artificielle ni profilage caché.']
]};
const d=isFr?fr:en;document.documentElement.lang=isFr?'fr':'en';document.title=isFr?'Bezy — Confidentialité':'Bezy — Privacy';document.getElementById('tagline').textContent=isFr?'Rencontrez quelqu’un qui mérite d’être connu.':'Meet someone worth knowing.';const other=document.getElementById('other-link');other.textContent=isFr?'Conditions':'Terms';other.href='/terms?lang='+(isFr?'fr':'en');document.getElementById('content').innerHTML=`<h1>${d.title}</h1><div class="updated">${d.date}</div><div class="notice">${d.intro}</div>${d.sections.map(s=>`<section><h2>${s[0]}</h2><p>${s[1]}</p></section>`).join('')}`;
</script>
